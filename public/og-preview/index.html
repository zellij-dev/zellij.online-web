<!DOCTYPE html>
<html lang="en">
<head><script src="/livereload.js?mindelay=10&amp;v=2&amp;port=1313&amp;path=livereload" data-no-instant defer></script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Social Preview</title>
  <link rel="icon" type="image/svg+xml" href="/img/favicon.svg">
  <link rel="stylesheet" href="/css/style.css">
  <style>
    html, body { background: var(--zo-bg); }
    body { margin: 0; padding: 0; display: flex; align-items: center; justify-content: center; min-height: 100vh; }

    .crop-guide {
      position: absolute;
      width: 1200px;
      height: 630px;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      outline: 2px dashed #ff3ea5;
      outline-offset: 8px;
      pointer-events: none;
    }
    .crop-guide::after {
      content: "screenshot area: 1200 x 630";
      position: absolute;
      left: 50%;
      top: -34px;
      transform: translateX(-50%);
      color: #ff3ea5;
      font-family: var(--zo-mono);
      font-size: 13px;
      white-space: nowrap;
    }

    .og-card {
      width: 1200px;
      height: 630px;
      box-sizing: border-box;
      position: relative;
      overflow: hidden;
      background: var(--zo-bg);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 60px 68px;
    }

    .og-content {
      width: 100%;
      display: grid;
      grid-template-columns: 1.15fr 1fr;
      align-items: center;
      gap: 52px;
    }

    .og-left { display: flex; flex-direction: column; justify-content: center; }

    .og-brand { display: flex; align-items: center; gap: 22px; margin-bottom: 22px; }
    .og-brand .hero-logo { color: var(--zo-accent); --logo-cut: var(--zo-bg); margin-left: -13px; }
    .og-brand .logo-full { width: 100px; height: 100px; display: block; }
    .og-brand h1 { margin: 0; font-size: 64px; line-height: 1; color: #d5d5ea; letter-spacing: -0.01em; }

    .og-tagline { margin: 0 0 34px; font-size: 29px; font-weight: 700; color: var(--zo-accent); line-height: 1.2; white-space: nowrap; }

    .og-chips { display: flex; flex-direction: column; gap: 18px; }
    .og-pill {
      display: flex;
      align-items: center;
      color: #d5d5ea;
      font-size: 23px;
      font-weight: 400;
      line-height: 1.15;
      white-space: nowrap;
    }
    .og-pill::before {
      content: "\25B8";
      flex: none;
      width: 22px;
      margin-right: 12px;
      color: var(--zo-accent);
      font-size: 21px;
    }

    .og-right {
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--zo-surface-deep);
      border: 1px solid var(--zo-border);
      padding: 14px;
    }
    .og-shot {
      display: block;
      max-width: 100%;
      max-height: 100%;
      width: auto;
      height: auto;
      object-fit: contain;
    }

  </style>
</head>
<body>
  <div class="crop-guide"></div>
  <div class="og-card">
    <div class="og-content">
    <div class="og-left">
      <div class="og-brand">
        <div class="hero-logo"><svg class="logo-full" aria-hidden="true" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
<polygon points="256.00,36.00 446.53,146.00 446.53,366.00 256.00,476.00 65.47,366.00 65.47,146.00" fill="none" stroke="currentColor" stroke-width="7.50" stroke-linejoin="miter"/>
<polygon points="259.00,48.99 433.78,149.90 361.90,191.39 259.00,131.98" fill="currentColor"/>
<polygon points="253.00,463.01 78.22,362.10 150.10,320.61 253.00,380.02" fill="currentColor"/>
<line x1="147.90" y1="193.59" x2="74.42" y2="151.17" stroke="currentColor" stroke-width="3.40" stroke-linecap="butt"/>
<line x1="364.10" y1="318.41" x2="437.58" y2="360.83" stroke="currentColor" stroke-width="3.40" stroke-linecap="butt"/>
<polygon points="256.00,137.18 358.90,196.59 358.90,315.41 256.00,374.82 153.10,315.41 153.10,196.59" fill="currentColor"/>
<path d="M193.4 210.9 L242.2 256 L193.4 301.1" fill="none" stroke="var(--logo-cut, var(--zo-accent))" stroke-width="21.3" stroke-linecap="butt" stroke-linejoin="miter"/>
<rect x="259.3" y="284.7" width="61.9" height="22.1" fill="var(--logo-cut, var(--zo-accent))"/>
</svg>
</div>
        <h1>Zellij.online</h1>
      </div>
      <p class="og-tagline">Terminal sharing that actually works.</p>
      <div class="og-chips">
        <span class="og-pill">Terminal sharing and streaming</span>
        <span class="og-pill">Private by design</span>
        <span class="og-pill">100% self-owned by the Zellij maintainers</span>
      </div>
    </div>
    <div class="og-right">
      <img class="og-shot" src="/img/alice-bob-screenshot.png" alt="Alice and Bob collaborating in a shared terminal session">
    </div>
    </div>
  </div>
</body>
</html>
