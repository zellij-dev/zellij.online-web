<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ with .Title }}{{ . }}{{ else }}{{ .Site.Title }}{{ end }}</title>
  <link rel="canonical" href="{{ .Permalink }}">
  <meta name="description" content="{{ with .Description }}{{ . }}{{ else }}{{ .Site.Params.description }}{{ end }}">
  {{ if or .Params.noindex (eq .Kind "404") }}<meta name="robots" content="noindex, nofollow">{{ end }}

  <meta property="og:title" content="{{ .Site.Params.tagline_1 }} - {{ .Site.Params.tagline_2 }}">
  <meta property="og:description" content="{{ .Site.Params.description }}">
  <meta property="og:type" content="website">
  <meta property="og:url" content="{{ .Permalink }}">
  <meta property="og:image" content="{{ "img/social-preview.png" | absURL }}">
  <meta property="og:image:width" content="1215">
  <meta property="og:image:height" content="643">
  <meta property="og:image:alt" content="Zellij.online - Terminal sharing that actually works. Alice and Bob collaborating in a shared terminal session.">

  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="{{ .Site.Params.tagline_1 }} - {{ .Site.Params.tagline_2 }}">
  <meta name="twitter:description" content="{{ .Site.Params.description }}">
  <meta name="twitter:image" content="{{ "img/social-preview.png" | absURL }}">
  <meta name="theme-color" content="#0e0e16">

  <link rel="icon" type="image/svg+xml" href="{{ "img/favicon.svg" | relURL }}">
  <link rel="stylesheet" href="{{ "css/style.css" | relURL }}">
  <script defer src="{{ "js/gsap.min.js" | relURL }}"></script>
  <script defer src="{{ "js/termshare.js" | relURL }}"></script>
  <script defer src="{{ "js/waitlist.js" | relURL }}"></script>
  <script data-goatcounter="https://zellij-online.goatcounter.com/count"
          async src="//gc.zgo.at/count.js"></script>
</head>
<body>

{{ block "main" . }}{{ end }}

<footer class="site-footer">
  <div class="footer-inner">
    <span class="footer-brand">poor.dev GmbH</span>
    <nav class="footer-nav" aria-label="Footer">
      <a href="{{ "/" | relURL }}">[ home ]</a>
      <a href="{{ "/legal/" | relURL }}">[ legal notice ]</a>
      <a href="{{ "/privacy/" | relURL }}">[ privacy ]</a>
    </nav>
  </div>
</footer>

</body>
</html>
