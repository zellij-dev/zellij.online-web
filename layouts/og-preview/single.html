<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ .Title }}</title>
  <link rel="icon" type="image/svg+xml" href="{{ "img/favicon.svg" | relURL }}">
  <link rel="stylesheet" href="{{ "css/style.css" | relURL }}">
  <style>
    html, body { background: var(--zo-bg); }
    body { margin: 0; padding: 0; display: flex; align-items: center; justify-content: center; min-height: 100vh; }

    .crop-guide {
      position: absolute;
      width: 1200px;
      height: 630px;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      outline: 2px dashed #ff3ea5;
      outline-offset: 8px;
      pointer-events: none;
    }
    .crop-guide::after {
      content: "screenshot area: 1200 x 630";
      position: absolute;
      left: 50%;
      top: -34px;
      transform: translateX(-50%);
      color: #ff3ea5;
      font-family: var(--zo-mono);
      font-size: 13px;
      white-space: nowrap;
    }

    .og-card {
      width: 1200px;
      height: 630px;
      box-sizing: border-box;
      position: relative;
      overflow: hidden;
      background: var(--zo-bg);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 60px 68px;
    }

    .og-content {
      width: 100%;
      display: grid;
      grid-template-columns: 1.15fr 1fr;
      align-items: center;
      gap: 52px;
    }

    .og-left { display: flex; flex-direction: column; justify-content: center; }

    .og-brand { display: flex; align-items: center; gap: 22px; margin-bottom: 22px; }
    .og-brand .hero-logo { color: var(--zo-accent); --logo-cut: var(--zo-bg); margin-left: -13px; }
    .og-brand .logo-full { width: 100px; height: 100px; display: block; }
    .og-brand h1 { margin: 0; font-size: 64px; line-height: 1; color: #d5d5ea; letter-spacing: -0.01em; }

    .og-tagline { margin: 0 0 34px; font-size: 29px; font-weight: 700; color: var(--zo-accent); line-height: 1.2; white-space: nowrap; }

    .og-chips { display: flex; flex-direction: column; gap: 18px; }
    .og-pill {
      display: flex;
      align-items: center;
      color: #d5d5ea;
      font-size: 23px;
      font-weight: 400;
      line-height: 1.15;
      white-space: nowrap;
    }
    .og-pill::before {
      content: "\25B8";
      flex: none;
      width: 22px;
      margin-right: 12px;
      color: var(--zo-accent);
      font-size: 21px;
    }

    .og-right {
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--zo-surface-deep);
      border: 1px solid var(--zo-border);
      padding: 14px;
    }
    .og-shot {
      display: block;
      max-width: 100%;
      max-height: 100%;
      width: auto;
      height: auto;
      object-fit: contain;
    }

  </style>
</head>
<body>
  <div class="crop-guide"></div>
  <div class="og-card">
    <div class="og-content">
    <div class="og-left">
      <div class="og-brand">
        <div class="hero-logo">{{ partial "logo.html" . }}</div>
        <h1>{{ .Site.Params.tagline_1 }}</h1>
      </div>
      <p class="og-tagline">{{ .Site.Params.tagline_2 }}</p>
      <div class="og-chips">
        <span class="og-pill">Terminal sharing and streaming</span>
        <span class="og-pill">Private by design</span>
        <span class="og-pill">100% self-owned by the Zellij maintainers</span>
      </div>
    </div>
    <div class="og-right">
      <img class="og-shot" src="{{ "img/alice-bob-screenshot.png" | relURL }}" alt="Alice and Bob collaborating in a shared terminal session">
    </div>
    </div>
  </div>
</body>
</html>
